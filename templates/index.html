<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MHO Burauen Claim Form</title>
        <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}"
              rel="stylesheet">
        <style>
            /* * MHO BURAUEN HEALTH CARE UI STYLES 
             */
            :root {
                --color-primary-green: #28a745; 
                --color-dark-green: #1e7e34;
                --color-light-green: #e9f5ed; 
                --color-text-dark: #343a40;
                --color-text-muted: #6c757d;
                --color-border: #ced4da;
            }

            body {
                background: #f8f9fa;
                font-family: 'Inter', sans-serif;
                color: var(--color-text-dark);
            }

            .modern-container {
                max-width: 1200px;
                margin: auto;
            }
            
            /* --- Custom Header Style --- */
            .app-header {
                background: linear-gradient(to right, var(--color-primary-green), #4CAF50);
                color: white;
                padding: 15px 30px;
                border-radius: 12px;
                margin-bottom: 25px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .app-header h1 {
                font-size: 1.6rem;
                font-weight: 700;
                margin-bottom: 0;
            }
            .app-header .subtitle {
                font-size: 0.95rem;
                opacity: 0.9;
                margin-top: 5px;
            }
            .mho-logo {
                width: 50px;
                height: 50px;
                border-radius: 50%;
                object-fit: cover;
                margin-right: 15px;
            }
             .app-header .header-icon-right {
                font-size: 2rem;
                color: rgba(255, 255, 255, 0.8);
             }


            /* Reduced vertical spacing utilities */
            .mb-2-5 { margin-bottom: 0.6rem !important; }

            .form-card {
                border: 1px solid var(--color-light-green);
                border-radius: 16px;
                padding: 20px;
                background: #ffffff;
                box-shadow: 0 8px 20px rgba(0, 50, 10, 0.04);
            }

            .section-header {
                font-size: 1.15rem;
                font-weight: 700;
                padding: 12px 20px;
                border-radius: 12px 12px 0 0;
                background: var(--color-primary-green);
                color: white;
                margin: -20px -20px 20px -20px;
                display: flex;
                align-items: center;
            }

            .section-header i {
                margin-right: 10px;
                font-size: 1.25rem;
            }

            .form-control, .form-select {
                border-radius: 8px;
                font-size: 0.85rem;
                padding: 8px 10px !important;
                height: 38px;
                border: 1px solid var(--color-border);
            }

            .form-control:focus, .form-select:focus {
                border-color: var(--color-primary-green);
                box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
            }

            .form-label {
                font-size: 0.75rem;
                font-weight: 600;
                margin-bottom: 2px;
                color: var(--color-text-muted);
            }
            
            .group-title {
                font-size: 0.95rem;
                font-weight: 700;
                color: var(--color-primary-green);
                margin-top: 15px;
                margin-bottom: 8px;
                border-left: 3px solid var(--color-primary-green);
                padding-left: 10px;
                display: flex;
                align-items: center;
            }
            .group-title i {
                margin-right: 6px;
                color: var(--color-text-dark);
            }
            
            /* --- Submit Button Styling (Solid Fill) --- */
            .btn-submit {
                background-color: var(--color-primary-green);
                border-color: var(--color-primary-green);
                color: white; /* Ensure text is white */
                font-weight: 600;
                border-radius: 8px;
                transition: background-color 0.2s;
            }
            .btn-submit:hover {
                background-color: var(--color-dark-green);
                border-color: var(--color-dark-green);
                color: white;
            }
            
            /* --- Custom Dependent/Member Toggle UI --- */
            .custom-radio-container {
                display: flex;
                gap: 10px; 
                margin-bottom: 15px;
            }
            .custom-radio-button {
                flex-grow: 1;
                text-align: center;
                border: 1px solid var(--color-border);
                border-radius: 8px;
                padding: 8px;
                cursor: pointer;
                transition: all 0.2s;
                background-color: #f0f2f5; 
                font-weight: 500;
                color: var(--color-text-dark);
            }
            .custom-radio-button:hover {
                background-color: #e2e4e7;
            }
            .custom-radio-button input[type="radio"] {
                display: none;
            }
            .custom-radio-button input[type="radio"]:checked + span {
                background-color: var(--color-light-green); 
                border-color: var(--color-primary-green);
                box-shadow: 0 0 5px rgba(40, 167, 69, 0.3);
                color: var(--color-primary-green);
                font-weight: 700;
            }
            .custom-radio-button span {
                display: block;
                border-radius: 6px;
                padding: 3px 0;
                font-size: 0.85rem;
            }
            
            /* Dependent Section Specific Padding Adjustment */
            #dependentSection {
                padding-top: 15px !important; 
                padding-bottom: 5px !important;
            }

            /* Uppercase Inputs */
            #philhealthForm input[type="text"],
            #philhealthForm input[type="date"],
            #philhealthForm select,
            #philhealthForm textarea {
                text-transform: uppercase;
            }
            #philhealthForm ::placeholder { text-transform: uppercase; }
        </style>
    </head>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
                crossorigin="anonymous"></script>
        <script>
            // Utility function to toggle required attributes
            function toggleRequired(selector, isRequired) {
                const elements = document.querySelectorAll(selector);
                elements.forEach(input => {
                    if (isRequired) {
                        input.setAttribute("required", "");
                    } else {
                        input.removeAttribute("required");
                    }
                });
            }

            // Dependent Section Logic (Updated for Radio Buttons)
            const patientIsMemberRadios = document.querySelectorAll('input[name="patientIsMember"]');
            const dependentSection = document.getElementById("dependentSection");
            const dependentSelector = "#dependentSection input, #dependentSection select";

            patientIsMemberRadios.forEach(radio => {
                radio.addEventListener("change", function() {
                    const isDependent = this.value === "no";
                    dependentSection.classList.toggle("d-none", !isDependent);
                    // Only make Name and Relationship required if dependent section is visible
                    const requiredDependentFields = "#dependentSection input[name$='name'], #dependentSection select[name='relationship']";
                    toggleRequired(requiredDependentFields, isDependent);

                    // Optional fields (like PIN, DOB) should not be forcibly required
                });
            });
            
            // Representative Section Logic
            const radioMember = document.getElementById("radioMember");
            const radioRep = document.getElementById("radioRep");
            const repSection = document.getElementById("representativeSection");
            const repSelector = "#representativeSection input, #representativeSection select";

            function updateRepresentativeSection() {
                const isRep = radioRep.checked;
                repSection.classList.toggle("d-none", !isRep);
                toggleRequired(repSelector, isRep);
            }

            radioMember.addEventListener("change", updateRepresentativeSection);
            radioRep.addEventListener("change", updateRepresentativeSection);

            // Uppercase Input Logic
            const allTextInputs = document.querySelectorAll("#philhealthForm input[type='text']");
            allTextInputs.forEach(input => {
                input.addEventListener("input", function() {
                    this.value = this.value.toUpperCase();
                });
            });

            // Submission Logic (using Bootstrap's validation class)
            (function () {
    'use strict'
    const form = document.getElementById('philhealthForm')
    
    form.addEventListener('submit', async function (event) {
        // Prevent default submission behavior
        event.preventDefault()
        event.stopPropagation()

        // Check if the form is valid according to HTML5/Bootstrap validation
        if (!form.checkValidity()) {
            form.classList.add('was-validated');
            return; // Stop if validation fails
        }
        
        // --- Form is valid, proceed with data collection and submission ---

        const patientIsMemberValue = document.querySelector('input[name="patientIsMember"]:checked').value;

        const data = {
            pin: form.pin.value,
            lastName: form.lastName.value,
            firstName: form.firstName.value,
            nameExt: form.nameExt.value,
            middleName: form.middleName.value,
            dob: form.dob.value,
            sex: form.sex.value,
            street: form.street.value,
            barangay: form.barangay.value,
            mobile: form.mobile.value,
            email: form.email.value,
            patientIsMember: patientIsMemberValue,
            dependent: patientIsMemberValue === "no" ? {
                depPin: form.depPin.value,
                depLname: form.depLname.value,
                depFname: form.depFname.value,
                depMname: form.depMname.value,
                depDob: form.depDob.value,
                depSex: form.depSex.value,
                depExt: form.depExt.value,
                relationship: form.relationship.value
            } : null,
            signee: form.signee.value,
            representative: form.signee.value === "representative" ? {
                repName: form.repName.value,
                repRelationship: form.repRelationship.value,
                repReason: form.repReason.value
            } : null,
            patientDisposition: form.querySelector("select[name='patientDisposition']")?.value || ""
        };
        
        // ** NEW SUBMISSION VIA FETCH API TO /submit_form **
        try {
            console.log("Attempting to submit data to /submit_form:", data);
            
            const response = await fetch('/submit_form', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                // Convert the JavaScript object to a JSON string
                body: JSON.stringify(data)
            });

            if (response.ok) {
                // Submission was successful (e.g., status 200-299)
                alert("✅ MHO Burauen Form submitted successfully!");
                window.location.href = '/view_print';
                form.reset(); // Clear the form fields
                form.classList.remove('was-validated'); // Remove validation state
            } else {
                // Submission failed on the server side (e.g., status 400 or 500)
                const errorText = await response.text();
                console.error("Submission failed:", errorText);
                alert(`⚠️ Submission failed. Server responded with status: ${response.status}`);
            }
        } catch (error) {
            // Network error (e.g., server offline)
            console.error("Network or unexpected error during submission:", error);
            alert("❌ An error occurred. Could not connect to the submission server.");
        }
        
        // Always add validation class for immediate visual feedback after attempt
        form.classList.add('was-validated');

    }, false);
})()

            // Initialize on load
            updateRepresentativeSection();
            document.querySelector('input[name="patientIsMember"]:checked').dispatchEvent(new Event('change'));
        </script>
    </body>
</html>
